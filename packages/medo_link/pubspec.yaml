name: medo_link
description: >
  Shared Dart client for MEDO's companion API — LAN discovery, presence-code
  pairing, and /ask. Used by both the watch and phone apps so the "connect to
  MEDO" system lives in one place.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
