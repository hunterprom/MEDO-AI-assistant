<!doctype html>
<meta charset="utf-8">
<title>MEDO — history</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --ink: #e6e9ef; --dim: #8b93a5; --accent: #5aa9ff;
    --fast: #3ecf8e; --semantic: #d7a72c; --llm: #5aa9ff; --bad: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --panel:#fff; --line:#e2e5ea; --ink:#171a21; --dim:#5c6474; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:14px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; z-index:2; }
  h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; letter-spacing:.02em; }
  input, select, button { font:inherit; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  input[type=search] { min-width:min(340px, 60vw); }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .count { color:var(--dim); margin-left:auto; white-space:nowrap; }
  main { padding:16px 20px 60px; display:grid; gap:10px; }
  .turn { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .meta { display:flex; gap:10px; align-items:center; color:var(--dim); font-size:12px; margin-bottom:6px; flex-wrap:wrap; }
  .tier { font-weight:600; letter-spacing:.04em; }
  .tier.FAST { color:var(--fast); } .tier.SEMANTIC { color:var(--semantic); } .tier.LLM { color:var(--llm); }
  .said { font-weight:600; }
  .reply { color:var(--dim); margin-top:4px; white-space:pre-wrap; }
  .corrected { color:var(--bad); }
  .spacer { flex:1; }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
  mark { background:rgba(90,169,255,.25); color:inherit; border-radius:3px; }
</style>
<header>
  <h1>MEDO — history</h1>
  <input type="search" id="q" placeholder="Search what was said or answered…" autofocus>
  <select id="tier"><option value="">every tier</option></select>
  <button id="refresh">Refresh</button>
  <span class="count" id="count"></span>
</header>
<main id="list"></main>
<script>
// Same origin, same auth: the page is served BY the companion API, so the
// browser's own credentials (loopback exemption or ?token=) already apply and
// nothing here handles a secret. The token, if one is in the URL, is passed
// straight back so a HUD opened over the LAN keeps working.
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const auth = (url) => TOKEN ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN) : url;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function highlight(text, needle) {
  const safe = esc(text);
  if (!needle.trim()) return safe;
  try {
    const re = new RegExp("(" + needle.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return safe.replace(re, "<mark>$1</mark>");
  } catch { return safe; }
}

async function load() {
  const q = $("q").value, tier = $("tier").value;
  const url = auth(`/history?q=${encodeURIComponent(q)}&tier=${encodeURIComponent(tier)}&limit=200`);
  let data;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(resp.status === 401 ? "not authorised" : "HTTP " + resp.status);
    data = await resp.json();
  } catch (err) {
    $("list").innerHTML = `<div class="empty">Couldn't load the history: ${esc(err.message)}</div>`;
    return;
  }
  const rows = data.turns || [];
  $("count").textContent = rows.length ? `${rows.length} turn${rows.length === 1 ? "" : "s"}` : "";
  // Rebuild the tier filter from what is actually in the history.
  const sel = $("tier");
  if (sel.options.length <= 1 && data.tiers) {
    for (const t of data.tiers) sel.add(new Option(t, t));
  }
  if (!rows.length) {
    $("list").innerHTML = `<div class="empty">Nothing recorded yet${q ? " for that search" : ""}.</div>`;
    return;
  }
  $("list").innerHTML = rows.map(r => `
    <div class="turn">
      <div class="meta">
        <span class="tier ${esc(r.tier)}">${esc(r.tier)}</span>
        <span>${esc(r.ts)}</span>
        ${r.skill ? `<span>${esc(r.skill)}</span>` : ""}
        ${r.latency_ms != null ? `<span>${Math.round(r.latency_ms)} ms</span>` : ""}
        ${r.confidence != null ? `<span>match ${r.confidence}</span>` : ""}
        ${r.corrected ? `<span class="corrected">corrected: ${esc(r.correction || "")}</span>` : ""}
        <span class="spacer"></span>
        <button data-text="${esc(r.text)}" class="rerun">Re-run</button>
      </div>
      <div class="said">${highlight(r.text, q)}</div>
      ${r.reply ? `<div class="reply">${highlight(r.reply, q)}</div>` : ""}
    </div>`).join("");
}

// Re-running goes through the ORDINARY /ask endpoint — the dashboard adds no
// new way to make MEDO do anything, so a destructive request re-run from here
// still hits the same confirmation gate it would by voice.
document.addEventListener("click", async (event) => {
  const button = event.target.closest(".rerun");
  if (!button) return;
  button.disabled = true; button.textContent = "Running…";
  try {
    const resp = await fetch(auth("/ask"), {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: button.dataset.text}),
    });
    const body = await resp.json();
    button.textContent = resp.ok ? "Re-ran" : (body.error || "Failed");
  } catch (err) {
    button.textContent = "Failed";
  }
  setTimeout(() => { button.disabled = false; button.textContent = "Re-run"; load(); }, 1200);
});

let timer;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 200); });
$("tier").addEventListener("change", load);
$("refresh").addEventListener("click", load);
load();
</script>
