# =============================================================================
# MEDO — configuration (super project: v1 jarvis-web + v2 merged)
# Every subsystem is swappable from here without touching code.
# Paths starting with ~ are expanded to your home directory.
# =============================================================================

llm:
  provider: "ollama"               # "ollama" (local) | "openai" (any OpenAI-compatible API)
  host: "http://localhost:11434"   # Ollama server
  # api_key: leave empty for local Ollama; set to use any OpenAI-compatible cloud model
  api_key: ""
  openai_base_url: "https://api.openai.com/v1"   # base URL of the OpenAI-compatible API
  # The brain. qwen3:30b is a thinking model — its </think> reasoning is
  # stripped in llm/client.py. Falls back to the first installed model if absent.
  default_model: "qwen3:30b"
  fallback_model: "llama3.2:3b"
  temperature: 0.6
  num_ctx: 4096                    # 8192 OOMs a 12 GB GPU with the 30B — keep 4096
  keep_alive: "30m"                # keep the model loaded between turns (no reload stalls)
  request_timeout_s: 120

router:
  fast_path_enabled: true           # deterministic skills before touching the LLM

personality:
  name: "MEDO"
  address_user_as: "sir"            # used sparingly by the system prompt (M4)

remote:
  # Companion API for the watch app (remote/server.py). LAN-only; no auth —
  # never forward this port beyond your local network.
  enabled: false                    # true = always serve; --serve flag also works
  host: "0.0.0.0"                   # bind address (0.0.0.0 = every interface)
  port: 8710

vision:                             # camera hand-gesture control (sidecar process)
  enabled: true                     # auto-serve the API so the gesture sidecar connects
  camera_index: 0
  stream_port: 8731                 # MJPEG stream the HUD embeds
  flip: true                        # mirror the selfie view
  max_fps: 15                       # throttle inference on CPU
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.5
  stability_frames: 6               # consecutive frames to confirm a gesture
  cooldown_s: 2.0                   # min gap before re-firing a gesture
  pointer:                          # gesture mouse control ("pointer on|off", HUD toggle)
    enabled: true                   # feature available (runtime toggle always starts OFF)
    sensitivity: 2.5                # hand movement -> cursor movement amplification
    ema_alpha: 0.4                  # smoothing (0..1; higher = snappier, lower = steadier)
    click_debounce_ms: 600          # min gap between gesture right-clicks
    hold_frames: 3                  # frames a right-click pose must hold before it fires
    scroll_gain: 45.0               # victory pose: hand up/down -> scroll speed
    zoom_gain: 25.0                 # rock pose: hand up/down -> zoom speed (ctrl+wheel)
    volume_interval_ms: 180         # min gap between volume steps while thumbs-up/pinky held
    exit_hold_frames: 18            # frames a fist must HOLD to exit (~1.2 s; brief
                                    # fist misreads while pointing don't kick you out)
  # NOTE: this build is pointer-only — the gesture->utterance map below is no
  # longer routed (kept for reference / future re-enable). Pointer poses:
  #   index=move, pinch=drag/click, victory=scroll, rock=zoom, three=right-click,
  #   thumbs_up=volume up, pinky=volume down, HELD fist=exit,
  #   anything unrecognized keeps moving the cursor.
  gestures:                         # (inactive) recognized gesture -> routed utterance
    thumbs_up: "yes"                # confirm a pending action (safety gate)
    open_palm: "no"                 # cancel
    victory:   "take a screenshot"
    point_up:  "volume up"
    three:     "volume down"        # index+middle+ring extended
    fist:      "mute"
    pinch:     "lock the screen"    # thumb tip touches index tip
    rock:      "play music"         # index+pinky extended (play/pause)

hud:                                # M.E.D.O. web HUD arc-reactor UI (--hud)
  enabled: false
  host: "127.0.0.1"
  port: 8730

# --- Subsystems below are configured now but wired in later milestones ---

stt:                                # M1
  engine: "faster-whisper"
  model: "small"                    # tiny | base | small | medium (accuracy↑, speed↓)
  device: "auto"                    # auto | cuda | cpu
  compute_type: "auto"
  language: null                    # null = auto-detect per utterance (Macedonian + English)
  beam_size: 5                      # beam search — more accurate than greedy (1)
  vad_filter: true                  # drop non-speech frames before decoding
  condition_on_previous_text: false # avoids runaway repeats on short clips
  filter_hallucinations: true       # drop low-confidence/junk Whisper segments
  no_speech_threshold: 0.6          # whisper non-speech gate
  # initial_prompt biases decoding toward command words but skews non-English
  # transcripts — keep it null while language auto-detect is on. If you pin
  # language: "en", restore the example prompt from the README.
  initial_prompt: null

tts:                                # M1
  engine: "piper"
  voice_model: "models/piper/en_US-lessac-medium.onnx"   # relative to project root
  speed: 1.0

wakeword:                           # M1
  engine: "openwakeword"
  phrase: "hey_jarvis"              # built-in model name (say "hey jarvis")
  # Lower = easier to trigger (0.5 is openWakeWord's default; 0.4 helps a
  # non-native "hey jarvis"). Watch your live score with:
  #   .venv\Scripts\python -m voice.wakeword
  # If the mic level stays ~0 there, it's the input device, not the threshold.
  threshold: 0.4

audio:                              # M1
  # Which microphone the wake word listens on — a PRIORITY LIST: the first
  # available device wins, and MEDO hot-swaps within ~2 s when a higher-priority
  # one connects. "A25" = the Bluetooth headphones' hands-free mic (used the
  # moment the headset connects to the PC for calls/voice); the webcam mic is
  # the fallback so voice keeps working when the headphones are off. Entries
  # can be an index or a name substring; run
  #   .venv\Scripts\python -m voice.wakeword
  # to list devices + watch live levels. null = system default.
  input_device: ["A25", "FHD Webcam"]
  output_device: null
  sample_rate: 16000
  # RMS below this counts as silence (speech onset gate). Quiet webcam/onboard
  # mics peak at only a few percent — 0.015 was above their speech level, so
  # recording never "started" and MEDO seemed deaf after waking. The adaptive
  # floor (ambient*2.5) still raises this automatically in noisy rooms.
  silence_threshold: 0.006
  silence_duration_s: 1.0           # stop recording after this much silence

safety:                             # M2
  confirm_destructive: true
  whitelist_dirs:                   # files.py may only touch these trees
    - "~/Documents"
    - "~/Downloads"
    - "~/Desktop"

skills:
  # apps.py — logical name -> per-platform launch command.
  # Cross-platform defaults; edit for your machine.
  apps:
    chrome:
      darwin:  "open -a 'Google Chrome'"
      windows: "start chrome"
      linux:   "google-chrome"
    browser:
      darwin:  "open -a Safari"
      windows: "start msedge"
      linux:   "xdg-open https://"
    editor:
      darwin:  "open -a 'Visual Studio Code'"
      windows: "code"
      linux:   "code"
    terminal:
      darwin:  "open -a Terminal"
      windows: "start cmd"
      linux:   "x-terminal-emulator"
    spotify:
      darwin:  "open -a Spotify"
      windows: "start spotify"
      linux:   "spotify"

weather:                            # M3
  default_city: "Skopje"
  latitude: 41.9973
  longitude: 21.4280

news:                               # M3
  feeds:
    - "https://feeds.bbci.co.uk/news/rss.xml"
    - "https://hnrss.org/frontpage"

vision_llm:                         # "what do you see" / "read my screen"
  model: "moondream"                # local Ollama vision model
  timeout_s: 60                     # describe calls are slow on first load

memory:                             # M4
  db_path: "jarvis.db"
  max_turns: 10                     # rolling conversation window sent to the LLM
  max_facts: 20                     # newest remembered facts injected into the system prompt

logging:
  level: "INFO"                     # DEBUG for state transitions + routing detail
  routing_stats: true               # tally fast-path vs LLM-path for the README
