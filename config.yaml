# =============================================================================
# MEDO — configuration (super project: v1 jarvis-web + v2 merged)
# Every subsystem is swappable from here without touching code.
# Paths starting with ~ are expanded to your home directory.
# =============================================================================

llm:
  # The brain MEDO thinks with. Switch here or live from the HUD CONFIG tab:
  #   ollama       local Ollama server
  #   openai       any OpenAI-compatible cloud API (GPT, Groq, ...)
  #   anthropic    the Claude API (api.anthropic.com)
  #   claude-code  the locally installed `claude` CLI agent (Claude Code)
  #   codex        the locally installed `codex` CLI agent (OpenAI Codex)
  provider: "ollama"
  host: "http://localhost:11434"   # Ollama server
  # api_key: leave empty for local Ollama; set to use any OpenAI-compatible cloud model
  api_key: ""
  openai_base_url: "https://api.openai.com/v1"   # base URL of the OpenAI-compatible API
  # Claude API (provider: anthropic) — its own key, so GPT + Claude coexist.
  # Prefer entering keys in the HUD: they land in git-ignored secrets.local.yaml.
  anthropic_api_key: ""
  anthropic_base_url: "https://api.anthropic.com"
  anthropic_max_tokens: 1024       # Claude requires an output cap (spoken replies are short)
  # CLI agents (provider: claude-code | codex): executable name or full path.
  # They use their own login (`claude login` / `codex login`) — no key here.
  claude_cmd: "claude"
  codex_cmd: "codex"
  cli_timeout_s: 180               # CLI agents think longer than a bare model call
  # The brain. qwen3:30b is a thinking model — its </think> reasoning is
  # stripped in llm/client.py. Falls back to the first installed model if absent.
  default_model: "qwen3:30b"
  fallback_model: "llama3.2:3b"
  temperature: 0.6
  num_ctx: 4096                    # 8192 OOMs a 12 GB GPU with the 30B — keep 4096
  keep_alive: "30m"                # keep the model loaded between turns (no reload stalls)
  request_timeout_s: 120

router:
  fast_path_enabled: true           # deterministic skills before touching the LLM

conversation:                       # continuous mode (voice/loop.py, core/modes.py)
  # When on, MEDO keeps listening after each reply for a natural follow-up
  # WITHOUT the wake word. Toggle live by voice ("continuous mode on") or the
  # HUD CONFIG switch — this is only the boot default.
  continuous: false
  followup_window_s: 8.0            # mic stays open this long for a follow-up,
                                    # then falls back to standby on silence

personality:
  name: "MEDO"
  address_user_as: "sir"            # used sparingly by the system prompt (M4)
  # The Jarvis charm (core/persona.py, M7). A decorator layer over the fast
  # path plus a manner fragment in the LLM system prompt — skills stay literal.
  style: "dry_wit"                  # dry_wit | professional | minimal
  wit_level: 0.3                    # 0 = never quip, 1 = quip often (fast path only;
                                    # never on errors, confirmations, or destructive acts)
  quips_language: "match"           # match user's language (mk quips for mk input) | en | mk

remote:
  # Companion API for the watch app (remote/server.py). LAN-only; there is no
  # TLS — never forward this port beyond your local network.
  enabled: false                    # true = always serve; --serve flag also works
  host: "0.0.0.0"                   # bind address (0.0.0.0 = every interface)
  port: 8710
  # Bearer-token auth for LAN clients. The token is generated on first serve
  # and stored in git-ignored secrets.local.yaml (remote.token). Easiest setup:
  # tap "Pair with MEDO" on the watch — it finds this PC (UDP discovery below),
  # MEDO flashes a 6-digit code on this screen, and typing that code on the
  # watch delivers the token automatically. Requests from this machine
  # (127.0.0.1: the HUD, the vision sidecar) never need a token. false = old
  # open behavior (UNSAFE: anyone on your network can type, screenshot, and
  # power off this PC).
  auth_enabled: true
  # Answer "who is MEDO?" UDP broadcasts (same port) so the watch can find
  # this machine without anyone typing an IP. Reveals only name + port.
  discovery_enabled: true

vision:                             # camera hand-gesture control (sidecar process)
  enabled: true                     # auto-serve the API so the gesture sidecar connects
  camera_index: 0
  stream_port: 8731                 # MJPEG stream the HUD embeds
  flip: true                        # mirror the selfie view
  max_fps: 15                       # throttle inference on CPU
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.5
  stability_frames: 6               # consecutive frames to confirm a gesture
  cooldown_s: 2.0                   # min gap before re-firing a gesture
  pointer:                          # gesture mouse control ("pointer on|off", HUD toggle)
    enabled: true                   # feature available (runtime toggle always starts OFF)
    sensitivity: 2.5                # hand movement -> cursor movement amplification
    ema_alpha: 0.4                  # smoothing (0..1; higher = snappier, lower = steadier)
    click_debounce_ms: 600          # min gap between gesture right-clicks
    hold_frames: 3                  # frames a right-click pose must hold before it fires
    scroll_gain: 45.0               # victory pose: hand up/down -> scroll speed
    zoom_gain: 25.0                 # rock pose: hand up/down -> zoom speed (ctrl+wheel)
    volume_interval_ms: 180         # min gap between volume steps while thumbs-up/pinky held
    exit_hold_frames: 18            # frames a fist must HOLD to exit (~1.2 s; brief
                                    # fist misreads while pointing don't kick you out)
  bench:                            # M10: 2nd workbench camera (skills/bench.py)
    enabled: false                  # "what's on my bench" / "identify this part" /
                                    # "log this part" / "do i have any 10k resistors"
    camera_index: 1                 # opened per request, released immediately —
                                    # never streamed (privacy + VRAM)
  # Screen agent (EXPERIMENTAL, skills/screen_agent.py): "do this for me: …"
  # looks at the screen and clicks/types/scrolls toward a goal. Gated by the
  # PC-control switch AND a spoken confirmation; bounded to agent_max_steps.
  agent_enabled: true
  agent_max_steps: 6
  # NOTE: this build is pointer-only — the gesture->utterance map below is no
  # longer routed (kept for reference / future re-enable). Pointer poses:
  #   index=move, pinch=drag/click, victory=scroll, rock=zoom, three=right-click,
  #   thumbs_up=volume up, pinky=volume down, HELD fist=exit,
  #   anything unrecognized keeps moving the cursor.
  gestures:                         # (inactive) recognized gesture -> routed utterance
    thumbs_up: "yes"                # confirm a pending action (safety gate)
    open_palm: "no"                 # cancel
    victory:   "take a screenshot"
    point_up:  "volume up"
    three:     "volume down"        # index+middle+ring extended
    fist:      "mute"
    pinch:     "lock the screen"    # thumb tip touches index tip
    rock:      "play music"         # index+pinky extended (play/pause)

hud:                                # M.E.D.O. web HUD arc-reactor UI (--hud)
  enabled: false
  host: "127.0.0.1"
  port: 8730

# --- Subsystems below are configured now but wired in later milestones ---

stt:                                # M1
  engine: "faster-whisper"
  # large-v3-turbo: near-large accuracy at ~medium size (~1.6 GB download on
  # first run). "small" was the Macedonian bottleneck — fine for "Како си?",
  # garbled anything complex. Runs on the GPU (float16) when CUDA's math libs
  # are loadable (pip install nvidia-cublas-cu12 nvidia-cudnn-cu12 — the run
  # environment has them); falls back to CPU int8, slower but correct.
  model: "large-v3-turbo"           # tiny | base | small | medium | large-v3-turbo
  device: "auto"                    # auto | cuda | cpu
  compute_type: "auto"
  language: null                    # null = auto-detect per utterance (Macedonian + English)
  # Auto-detect clamp: Whisper regularly hears Macedonian as Bulgarian/Serbian
  # and then decodes garbage. Detections outside this list trigger ONE forced
  # re-transcription as "mk". Empty list = no clamp.
  allowed_languages: ["en", "mk"]
  beam_size: 5                      # beam search — more accurate than greedy (1)
  vad_filter: true                  # drop non-speech frames before decoding
  condition_on_previous_text: false # avoids runaway repeats on short clips
  filter_hallucinations: true       # drop low-confidence/junk Whisper segments
  no_speech_threshold: 0.6          # whisper non-speech gate
  # initial_prompt biases decoding toward command words but skews non-English
  # transcripts — keep it null while language auto-detect is on. If you pin
  # language: "en", restore the example prompt from the README.
  initial_prompt: null

tts:                                # M1
  engine: "piper"
  voice_model: "models/piper/en_US-lessac-medium.onnx"   # relative to project root
  speed: 1.0
  multilingual: true                # Cyrillic replies -> Macedonian neural voice (edge-tts, online)
  mk_voice: "mk-MK-MarijaNeural"    # or mk-MK-AleksandarNeural (male)

wakeword:                           # M1
  engine: "openwakeword"
  # Either a bundled openWakeWord model name ("hey_jarvis") or a PATH to your
  # own trained model, .onnx or .tflite — absolute, ~, or relative to the
  # project root, e.g. "models/wakeword/hey_medo.onnx". To make "hey MEDO":
  #   1) generate a diverse sample set (edge-tts + Piper):
  #        .venv\Scripts\python -m voice.train_wakeword --generate
  #   2) train it (~1 h on a free Colab GPU) — the script prints the steps;
  #      see docs/Wake Word Training.md for the full runbook.
  #   3) drop hey_medo.onnx in models/wakeword/ and set phrase to it below.
  phrase: "models/wakeword/hey_medo.onnx"   # custom "hey MEDO" model (trained
                                    # locally 2026-07-20; acc 0.85, recall 0.76,
                                    # 0.09 FP/hr). Was "hey_jarvis" (built-in).
  # Lower = easier to trigger (0.5 is openWakeWord's default; 0.4 helps a
  # non-native "hey jarvis"). Watch your live score with:
  #   .venv\Scripts\python -m voice.wakeword
  # If the mic level stays ~0 there, it's the input device, not the threshold.
  # 0.5 for the custom hey_medo model: it scores 0.99+ on real "hey medo" and
  # <0.2 on near-misses, so 0.5 separates cleanly. Nudge down if your voice/mic
  # under-triggers, up if it false-fires.
  threshold: 0.5

audio:                              # M1
  # Which microphone the wake word listens on — a PRIORITY LIST: the first
  # available device wins, and MEDO hot-swaps within ~2 s when a higher-priority
  # one connects. "A25" = the Bluetooth headphones' hands-free mic (used the
  # moment the headset connects to the PC for calls/voice); the webcam mic is
  # the fallback so voice keeps working when the headphones are off. Entries
  # can be an index or a name substring; run
  #   .venv\Scripts\python -m voice.wakeword
  # to list devices + watch live levels. null = system default.
  input_device: ["A25", "FHD Webcam"]
  output_device: null
  sample_rate: 16000
  # RMS below this counts as silence (speech onset gate). Quiet webcam/onboard
  # mics peak at only a few percent — 0.015 was above their speech level, so
  # recording never "started" and MEDO seemed deaf after waking. The adaptive
  # floor (ambient*2.5) still raises this automatically in noisy rooms.
  silence_threshold: 0.006
  # Stop recording after this much continuous quiet. 1.0 s cut complex
  # sentences off at natural mid-thought pauses ("Кажи ми... [pause] ...какво
  # ќе биде времето") — 1.4 s trades a touch of snappiness for whole sentences.
  silence_duration_s: 1.4

safety:                             # M2
  confirm_destructive: true
  # Master switch: may MEDO ACT on this computer (type, click, open apps and
  # websites, move files, power)? Toggle it live from the HUD CONFIG tab
  # ("PC control") — the live choice persists per machine in
  # secrets.local.yaml. Sensing (vision, weather, questions) always works.
  pc_control_enabled: true
  whitelist_dirs:                   # files.py may only touch these trees
    - "~/Documents"
    - "~/Downloads"
    - "~/Desktop"

skills:
  # apps.py — logical name -> per-platform launch command.
  # Cross-platform defaults; edit for your machine.
  apps:
    chrome:
      darwin:  "open -a 'Google Chrome'"
      windows: "start chrome"
      linux:   "google-chrome"
    browser:
      darwin:  "open -a Safari"
      windows: "start msedge"
      linux:   "xdg-open https://"
    editor:
      darwin:  "open -a 'Visual Studio Code'"
      windows: "code"
      linux:   "code"
    terminal:
      darwin:  "open -a Terminal"
      windows: "start cmd"
      linux:   "x-terminal-emulator"
    spotify:
      darwin:  "open -a Spotify"
      windows: "start spotify"
      linux:   "spotify"

weather:                            # M3
  default_city: "Skopje"
  latitude: 41.9973
  longitude: 21.4280

news:                               # M3
  feeds:
    - "https://feeds.bbci.co.uk/news/rss.xml"
    - "https://hnrss.org/frontpage"

vision_llm:                         # "what do you see" / "read my screen" / bench
  # qwen2.5vl:3b replaced moondream (2026-07-20): the re-published moondream
  # decodes to 2-token garbage on every runtime/endpoint (fresh pull, GPU and
  # CPU, old and new Ollama — see Bug Log 28). qwen2.5vl also reads text far
  # better, which the see_bench part-marking answers benefit from.
  model: "qwen2.5vl:3b"             # local Ollama vision model
  timeout_s: 60                     # describe calls are slow on first load

memory:                             # M4
  db_path: "jarvis.db"
  max_turns: 10                     # rolling conversation window sent to the LLM
  max_facts: 20                     # remembered facts injected into the system prompt
  embed_model: "nomic-embed-text"   # semantic fact recall via local Ollama embeddings
                                    # ("" disables -> newest-N only)

mcp:                                # Model Context Protocol client (core/mcp.py)
  # Connect ANY application that exposes an MCP server: its tools automatically
  # become MEDO skills the LLM can call — no per-app code. Two transports:
  #   command/args  spawn a local server over stdio (npx/uvx/binary)
  #   url           connect to a running server over Streamable HTTP
  # Requires `pip install mcp` (in requirements.txt). Examples:
  #
  #   servers:
  #     filesystem:                 # give MEDO file tools over ~/Documents
  #       command: "npx"
  #       args: ["-y", "@modelcontextprotocol/server-filesystem", "~/Documents"]
  #     fetch:                      # web page fetching
  #       command: "uvx"
  #       args: ["mcp-server-fetch"]
  #     my-app:                     # anything already serving MCP over HTTP
  #       url: "http://localhost:3000/mcp"
  enabled: true
  connect_timeout_s: 15
  call_timeout_s: 60
  servers: {}

routines:                           # proactive schedule (core/routines.py)
  - name: "morning briefing"
    at: "08:00"                     # HH:MM local time
    days: []                        # empty = every day; or [mon, tue, wed, thu, fri]
    ask:
      - "morning briefing"          # the M8 briefing skill: one flowing summary
    enabled: true

briefing:                           # morning briefing content (skills/briefing.py)
  # Sections in speaking order; remove one to drop it. Each degrades on its
  # own (offline weather, empty reminders, ...) — the briefing never fails.
  # Also on demand: say "morning briefing", "brief me", or "добро утро медо".
  sections: ["weather", "news", "reminders", "upcoming"]

logging:
  level: "INFO"                     # DEBUG for state transitions + routing detail
  routing_stats: true               # tally fast-path vs LLM-path for the README
